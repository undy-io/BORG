name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1

      - name: Run lint
        run: golangci-lint run ./...

      - name: Validate host harness syntax
        run: |
          bash -n scripts/validate-kind-go.sh
          bash -n scripts/validate-kafka-logging.sh

      - name: Build BORG
        run: go build ./cmd/borg

      - name: Build borg-genkey
        run: go build ./cmd/borg-genkey
