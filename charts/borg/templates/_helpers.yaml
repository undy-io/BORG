{{- define "borg.name" -}}
{{- .Chart.Name | trunc 63 | trimSuffix "-" -}}
{{- end }}

{{- define "borg.fullname" -}}
{{- printf "%s-%s" .Release.Name (include "borg.name" .) | trunc 63 | trimSuffix "-" -}}
{{- end }}

{{- define "borg.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" -}}
{{- end }}

{{- define "borg.ingressTLSSecretName" -}}
{{- default (printf "%s-tls" .Release.Name) .Values.ingress.tls.secretName -}}
{{- end -}}

{{- define "borg.certificateSecretName" -}}
{{- default (printf "%s-tls" .Release.Name) .Values.certificate.secretName -}}
{{- end -}}

{{- define "borg.serverTLSSecretName" -}}
{{- default (include "borg.certificateSecretName" .) .Values.server.tls.secretName -}}
{{- end -}}

{{- define "borg.serviceAccountName" -}}
{{- if .Values.serviceAccount.create -}}
{{- default (include "borg.fullname" .) .Values.serviceAccount.name -}}
{{- else -}}
{{- default "default" .Values.serviceAccount.name -}}
{{- end -}}
{{- end -}}

{{- define "borg.authSecretName" -}}
{{- $name := default .Values.authKeySecret.name .Values.authKeySecret.existingSecret -}}
{{- required "authKeySecret.name or authKeySecret.existingSecret must be set" $name -}}
{{- end -}}

{{- define "borg.apiKeySecretName" -}}
{{- $name := default .Values.apikeySecrets.name .Values.apikeySecrets.existingSecret -}}
{{- required "apikeySecrets.name or apikeySecrets.existingSecret must be set" $name -}}
{{- end -}}
