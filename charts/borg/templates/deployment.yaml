{{- if and .Values.server.tls.enabled (not .Values.certificate.enabled) (not .Values.server.tls.secretName) -}}
{{- fail "server.tls.secretName must be set when server.tls.enabled=true and certificate.enabled=false" -}}
{{- end -}}
{{- $serverTLS := .Values.server.tls.enabled -}}
{{- $portName := ternary "https" "http" $serverTLS -}}
{{- $probeScheme := ternary "HTTPS" "HTTP" $serverTLS -}}
{{- $backendEntries := concat (default (list) .Values.config.instances) (default (list) .Values.config.k8s_service_discover) -}}
{{- $envNamePattern := "^[A-Za-z_][A-Za-z0-9_]*$" -}}
{{- $requestLogging := .Values.config.request_logging -}}
{{- $kafkaEnabled := eq $requestLogging.sink "kafka" -}}
{{- $kafkaSASLEnabled := and $kafkaEnabled (ne $requestLogging.kafka.sasl.mechanism "none") -}}
{{- $kafkaTLSFiles := or $requestLogging.kafka.tls.ca_file $requestLogging.kafka.tls.cert_file $requestLogging.kafka.tls.key_file -}}
{{- if and $kafkaEnabled (lt (int .Values.terminationGracePeriodSeconds) (add 30 (int $requestLogging.shutdown_timeout_seconds))) -}}
{{- fail (printf "terminationGracePeriodSeconds must be at least %d when Kafka request logging is enabled" (add 30 (int $requestLogging.shutdown_timeout_seconds))) -}}
{{- end -}}
{{- $authEnv := .Values.authKeySecret.key | required "authKeySecret.key must be set" -}}
{{- if not (regexMatch $envNamePattern $authEnv) -}}
{{- fail (printf "authKeySecret.key %q must be a portable environment variable name" $authEnv) -}}
{{- end -}}
{{- if has $authEnv (list "PORT" "PROXY_CONFIG" "API_KEY" "TLS_CERT_FILE" "TLS_KEY_FILE") -}}
{{- fail (printf "authKeySecret.key %q is reserved by BORG" $authEnv) -}}
{{- end -}}
{{- $backendReserved := list "PORT" "PROXY_CONFIG" "AUTH_KEY" "BORG_AUTH_KEY" "TLS_CERT_FILE" "TLS_KEY_FILE" -}}
{{- $kafkaUsernameEnv := $requestLogging.kafka.sasl.username_from_env -}}
{{- $kafkaPasswordEnv := $requestLogging.kafka.sasl.password_from_env -}}
{{- if $kafkaSASLEnabled -}}
{{- if not .Values.requestLoggingSecrets.kafkaCredentials.existingSecret -}}
{{- fail "requestLoggingSecrets.kafkaCredentials.existingSecret is required when Kafka SASL is enabled" -}}
{{- end -}}
{{- range $name := list $kafkaUsernameEnv $kafkaPasswordEnv -}}
{{- if not (regexMatch $envNamePattern $name) -}}
{{- fail (printf "Kafka SASL environment name %q must be a portable environment variable name" $name) -}}
{{- end -}}
{{- if or (has $name $backendReserved) (eq $name "API_KEY") (eq $name $authEnv) -}}
{{- fail (printf "Kafka SASL environment name %q collides with a BORG environment variable" $name) -}}
{{- end -}}
{{- end -}}
{{- if eq $kafkaUsernameEnv $kafkaPasswordEnv -}}
{{- fail "Kafka SASL username and password environment names must be different" -}}
{{- end -}}
{{- end -}}
{{- if and $kafkaEnabled $kafkaTLSFiles (not .Values.requestLoggingSecrets.kafkaTLS.existingSecret) -}}
{{- fail "requestLoggingSecrets.kafkaTLS.existingSecret is required when Kafka TLS file paths are configured" -}}
{{- end -}}
{{- if and $kafkaEnabled $kafkaTLSFiles -}}
{{- $mountPrefix := printf "%s/" (trimSuffix "/" .Values.requestLoggingSecrets.kafkaTLS.mountPath) -}}
{{- range $path := list $requestLogging.kafka.tls.ca_file $requestLogging.kafka.tls.cert_file $requestLogging.kafka.tls.key_file -}}
{{- if and $path (not (hasPrefix $mountPrefix $path)) -}}
{{- fail (printf "Kafka TLS file path %q must be below requestLoggingSecrets.kafkaTLS.mountPath %q" $path .Values.requestLoggingSecrets.kafkaTLS.mountPath) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $backendEntries -}}
{{- if .apikeyEnv -}}
{{- if not (regexMatch $envNamePattern .apikeyEnv) -}}
{{- fail (printf "apikeyEnv %q must be a portable environment variable name" .apikeyEnv) -}}
{{- end -}}
{{- if or (has .apikeyEnv $backendReserved) (eq .apikeyEnv $authEnv) (and $kafkaSASLEnabled (or (eq .apikeyEnv $kafkaUsernameEnv) (eq .apikeyEnv $kafkaPasswordEnv))) -}}
{{- fail (printf "apikeyEnv %q collides with a BORG environment variable" .apikeyEnv) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $podAnnotations := deepCopy (default (dict) .Values.podAnnotations) -}}
{{- $authChecksumInput := dict "create" .Values.authKeySecret.create "existingSecret" .Values.authKeySecret.existingSecret "name" .Values.authKeySecret.name "key" $authEnv "value" (default "" .Values.authKeySecret.value) -}}
{{- $backendCredentials := dict -}}
{{- $createAPIKeySecret := and .Values.apikeySecrets.create (not .Values.apikeySecrets.existingSecret) -}}
{{- if $createAPIKeySecret -}}
{{- range $backendEntries -}}
{{- if .apikeyEnv -}}
{{- $value := required (printf "apikey is required for %s when apikeySecrets.create=true" .apikeyEnv) .apikey -}}
{{- if and (hasKey $backendCredentials .apikeyEnv) (ne (get $backendCredentials .apikeyEnv) $value) -}}
{{- fail (printf "conflicting apikey values for apikeyEnv %s" .apikeyEnv) -}}
{{- end -}}
{{- $_ := set $backendCredentials .apikeyEnv $value -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $backendChecksumInput := dict "create" .Values.apikeySecrets.create "existingSecret" .Values.apikeySecrets.existingSecret "name" .Values.apikeySecrets.name "credentials" $backendCredentials -}}
{{- $_ := set $podAnnotations "checksum.borg.undy.io/config" (include (print $.Template.BasePath "/config.yaml") . | sha256sum) -}}
{{- $_ := set $podAnnotations "checksum.borg.undy.io/auth" (toJson $authChecksumInput | sha256sum) -}}
{{- $_ := set $podAnnotations "checksum.borg.undy.io/backend-credentials" (toJson $backendChecksumInput | sha256sum) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "borg.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "borg.name" . }}
    chart: {{ include "borg.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "borg.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "borg.name" . }}
        release: {{ .Release.Name }}
      annotations:
{{ toYaml $podAnnotations | indent 8 }}
    spec:
      serviceAccountName: {{ include "borg.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: borg-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
{{ toYaml . | indent 12 }}
          {{- end }}
          ports:
            - name: {{ $portName }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.service.targetPort }}"
            - name: PROXY_CONFIG
              value: /app/config.yaml
            - name: {{ .Values.authKeySecret.key | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "borg.authSecretName" . }}
                  key: {{ .Values.authKeySecret.key | quote }}
            {{- if $serverTLS }}
            - name: TLS_CERT_FILE
              value: {{ printf "%s/%s" .Values.server.tls.mountPath .Values.server.tls.certKey | quote }}
            - name: TLS_KEY_FILE
              value: {{ printf "%s/%s" .Values.server.tls.mountPath .Values.server.tls.privateKeyKey | quote }}
            {{- end }}
            {{- if $kafkaSASLEnabled }}
            - name: {{ $kafkaUsernameEnv | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.requestLoggingSecrets.kafkaCredentials.existingSecret | quote }}
                  key: {{ .Values.requestLoggingSecrets.kafkaCredentials.usernameKey | quote }}
            - name: {{ $kafkaPasswordEnv | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.requestLoggingSecrets.kafkaCredentials.existingSecret | quote }}
                  key: {{ .Values.requestLoggingSecrets.kafkaCredentials.passwordKey | quote }}
            {{- end }}
            {{- $seenAPIKeyEnvs := dict }}
            {{- range $backendEntries }}
            {{- if and .apikeyEnv (not (hasKey $seenAPIKeyEnvs .apikeyEnv)) }}
            {{- $_ := set $seenAPIKeyEnvs .apikeyEnv true }}
            - name: {{ .apikeyEnv | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "borg.apiKeySecretName" $ }}
                  key: {{ .apikeyEnv | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
            {{- if $serverTLS }}
            - name: tls-volume
              mountPath: {{ .Values.server.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and $kafkaEnabled $kafkaTLSFiles }}
            - name: kafka-tls-volume
              mountPath: {{ .Values.requestLoggingSecrets.kafkaTLS.mountPath | quote }}
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
              scheme: {{ $probeScheme }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
              scheme: {{ $probeScheme }}
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "borg.fullname" . }}-config
        {{- if $serverTLS }}
        - name: tls-volume
          secret:
            secretName: {{ include "borg.serverTLSSecretName" . }}
            items:
              - key: {{ .Values.server.tls.certKey }}
                path: {{ .Values.server.tls.certKey }}
              - key: {{ .Values.server.tls.privateKeyKey }}
                path: {{ .Values.server.tls.privateKeyKey }}
        {{- end }}
        {{- if and $kafkaEnabled $kafkaTLSFiles }}
        - name: kafka-tls-volume
          secret:
            secretName: {{ .Values.requestLoggingSecrets.kafkaTLS.existingSecret | quote }}
        {{- end }}
