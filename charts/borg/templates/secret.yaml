{{- /*
     authKeySecret:
       create: true
       existingSecret: ""             # pre-created Secret name; disables auth Secret rendering
       name: my-auth-secret
       key:  AUTH_KEY                 # the map key inside the Secret (required)
       value: ""                      # optional URL-safe auth key string; leave empty to auto-generate
*/ -}}

{{- $name      := include "borg.authSecretName" . }}
{{- $key       := .Values.authKeySecret.key  | required "authKeySecret.key must be set" }}
{{- $keyValue := .Values.authKeySecret.value }}
{{- if and $keyValue (ne $keyValue "EMPTY") (not (regexMatch "^[A-Za-z0-9_-]{43}=?$" $keyValue)) }}
{{- fail "authKeySecret.value must be EMPTY or a padded/unpadded base64url value that decodes to 32 bytes" }}
{{- end }}
{{- $createAuthSecret := and .Values.authKeySecret.create (not .Values.authKeySecret.existingSecret) }}
{{- $existingValue := "" }}
{{- if and $createAuthSecret (not $keyValue) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- if $existing.data }}
{{- if hasKey $existing.data $key }}
{{- $existingValue = index $existing.data $key }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $backendEntries := concat (default (list) .Values.config.instances) (default (list) .Values.config.k8s_service_discover) }}
{{- $createAPIKeySecret := and .Values.apikeySecrets.create (not .Values.apikeySecrets.existingSecret) }}
{{- $apiKeyValues := dict }}
{{- $apiKeyNames := list }}
{{- if $createAPIKeySecret }}
{{- range $backendEntries }}
{{- if .apikeyEnv }}
{{- $value := required (printf "apikey is required for %s when apikeySecrets.create=true" .apikeyEnv) .apikey }}
{{- if hasKey $apiKeyValues .apikeyEnv }}
{{- if ne (get $apiKeyValues .apikeyEnv) $value }}
{{- fail (printf "conflicting apikey values for apikeyEnv %s" .apikeyEnv) }}
{{- end }}
{{- else }}
{{- $_ := set $apiKeyValues .apikeyEnv $value }}
{{- $apiKeyNames = append $apiKeyNames .apikeyEnv }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- if $createAuthSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- /* Operator-supplied values take precedence and are encoded for Secret.data. */}}
  {{- if $keyValue }}
  {{ $key | quote }}: {{ $keyValue | b64enc }}
  {{- /* Preserve existing Secret.data exactly on upgrade. */}}
  {{- else if $existingValue }}
  {{ $key | quote }}: {{ $existingValue }}
  {{- /* randBytes returns base64 text; normalize to URL-safe and encode for Secret.data. */}}
  {{- else }}
  {{ $key | quote }}: {{ randBytes 32 | replace "+" "-" | replace "/" "_" | b64enc }}
  {{- end }}
{{- end }}
{{- if and $createAPIKeySecret $apiKeyNames }}
{{- if $createAuthSecret }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "borg.apiKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- range sortAlpha $apiKeyNames }}
  {{ . | quote }}: {{ get $apiKeyValues . | quote }}
  {{- end }}
{{- end }}
