replicaCount: 2

image:
  # Go BORG runtime image. The chart no longer runs the Python service by default.
  repository: ghcr.io/undy-io/borg
  tag: "0.2.0"
  pullPolicy: IfNotPresent

authKeySecret:
  create: true
  existingSecret: ""
  name: borg-auth
  key: BORG_AUTH_KEY
  # Optional URL-safe auth key string. This should be the printable base64url
  # value the app consumes, not a Secret.data-encoded blob.
  # value: ""

apikeySecrets:
  # Set existingSecret to use a pre-created Secret, or create=false to
  # reference name without having Helm render it.
  create: true
  existingSecret: ""
  name: borg-apikeys

serviceAccount:
  create: true
  name: ""

# Pod-template annotations for integrations such as external Secret reloaders.
# BORG's internal checksum annotations take precedence over matching keys.
podAnnotations: {}

rbac:
  create: true
  clusterScoped: true
  namespaces: []
  extraRules: []

podSecurityContext: {}

securityContext: {}

resources: {}

terminationGracePeriodSeconds: 60

requestLoggingSecrets:
  kafkaCredentials:
    existingSecret: ""
    usernameKey: username
    passwordKey: password
  kafkaTLS:
    existingSecret: ""
    mountPath: /app/kafka-tls

config:
  auth_prefix: "BORG:"
  update_interval: 30
  max_request_body_bytes: 67108864
  backend_health:
    enabled: true
    failure_threshold: 3
    cooldown_seconds: 30
    eject_on_500: false
  upstream:
    # Time to wait after sending a request for final response headers to complete.
    # Set to 0 for unlimited.
    response_header_timeout_seconds: 300
  request_logging:
    sink: noop
    queue_capacity: 100000
    queue_capacity_bytes: 4294967296
    shutdown_timeout_seconds: 10
    capture:
      request_body: true
      response_body: true
      request_headers: false
      response_headers: false
      excluded_request_headers: []
      excluded_response_headers: []
      max_request_body_bytes: 524288
      max_response_body_bytes: 16777216
    session_headers: []
    partition_header: ""
    filters: []
    kafka:
      brokers: []
      topic: borg.request-events.v1
      client_id: borg
      tls:
        enabled: false
        server_name: ""
        ca_file: ""
        cert_file: ""
        key_file: ""
      sasl:
        mechanism: none
        username_from_env: BORG_KAFKA_USERNAME
        password_from_env: BORG_KAFKA_PASSWORD
  instances: []
  # - endpoint: http://10.0.0.5:8000
  #   apikeyEnv: VLLM_APIKEY_1
  #   apikey: sk-example # Secret input when apikeySecrets.create=true
  #   models: ["gpt-3.5-turbo"]
  k8s_discover:
    - namespace: vllm-services
      selector: borg/expose=default
      modelkey: borg/models
  k8s_service_discover: []
  # Discover an llm-d inference scheduler/router Service as one BORG endpoint.
  # - id: qwen-router
  #   namespace: llm-d
  #   service_name: qwen-inference-scheduler
  #   port_name: http
  #   models: ["Qwen/Qwen3-32B"]
  #   # Or omit models to query the router's /v1/models endpoint.
  #   automodel: true
  #   models_path: /v1/models
  #   apikeyEnv: LLMD_API_KEY
  #   apikey: sk-router # Secret input when apikeySecrets.create=true

server:
  tls:
    enabled: false
    secretName: ""
    mountPath: /app/tls
    certKey: tls.crt
    privateKeyKey: tls.key

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  issuer:
    name: pkirules-tls
    kind: Issuer  # Could be ClusterIssuer for other environments
    scope: namespaced  # or "cluster" if you ever switch
    annotations: {}
    cert:
      enabled: true
      subject:
        #commonName:
        organizations: []
        organizationalUnits: []
        countries: []
        localities: []
        provinces: []
      altNames: []
  hosts:
    - host: borg.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    existingSecret: null
    secretName: ""

certificate:
  # Set enabled=true to create a cert-manager Certificate independently of Ingress.
  enabled: false
  labels: {}
  annotations: {}
  secretName: ""
  commonName: ""
  dnsNames: []
  # altNames is kept as a friendly alias for additional DNS SANs.
  altNames: []
  ipAddresses: []
  uris: []
  emailAddresses: []
  issuerRef:
    name: ""
    kind: Issuer
    group: cert-manager.io
  usages: []
  subject:
    organizations: []
    organizationalUnits: []
    countries: []
    localities: []
    provinces: []
    streetAddresses: []
    postalCodes: []
    serialNumber: ""

service:
  type: ClusterIP
  labels: {}
  annotations: {}
  # loadBalancerClass: io.cilium/l2-announcer
  # loadBalancerIP is legacy but still supported by Cilium LB IPAM.
  # Prefer the lbipam.cilium.io/ips annotation for requested IPs.
  # loadBalancerIP: ""
  loadBalancerSourceRanges: []
  # externalTrafficPolicy: Cluster
  port: 80
  targetPort: 8000
