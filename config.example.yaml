# THIS IS AN EXAMPLE CONFIG
borg:
    auth_key: "EMPTY"
    # auth_key_from_env: BORG_AUTH_KEY
    auth_prefix: ""
    update_interval: -1
    max_request_body_bytes: 67108864
    backend_health:
      enabled: true
      failure_threshold: 3
      cooldown_seconds: 30
      eject_on_500: false
    upstream:
      # Time to wait after upload for final response headers; 0 means unlimited.
      response_header_timeout_seconds: 300
    request_logging:
      # noop preserves normal proxy behavior without event export.
      sink: noop
      queue_capacity: 100000
      queue_capacity_bytes: 4294967296
      shutdown_timeout_seconds: 10
      capture:
        request_body: true
        response_body: true
        # Header capture is privileged and may export credentials or personal data.
        request_headers: true
        response_headers: true
        # These are operator-selected examples, not hard-coded BORG restrictions.
        excluded_request_headers:
          - Authorization
          - Proxy-Authorization
          - Cookie
          - X-API-Key
          - X-Amz-Security-Token
        excluded_response_headers:
          - Set-Cookie
          - Proxy-Authenticate
        max_request_body_bytes: 524288
        max_response_body_bytes: 16777216
      session_headers: []
      # - name: X-Session-ID
      #   value_mode: sha256
      partition_header: ""
      filters: []
      # - models: ["^Qwen/"]
      kafka:
        brokers: []
        topic: borg.request-events.v1
        client_id: borg
        tls:
          enabled: false
          server_name: ""
          ca_file: ""
          cert_file: ""
          key_file: ""
        sasl:
          mechanism: none
          username_from_env: BORG_KAFKA_USERNAME
          password_from_env: BORG_KAFKA_PASSWORD
    instances:
      # - endpoint: "http://10.0.0.5:8000"
      #   apikey: "sk‑examplekey123"
      #   models: ["gpt-3.5-turbo", "gpt-3.5-turbo-0125"]

      # - endpoint: "http://10.0.0.6:8000"
      #   apikey: "sk‑anotherkey456"
      #   models: ["gpt-4o", "gpt-4o-mini"]
    k8s_discover:
      # - id: vllm-pods
      #   namespace: vllm-servers
      #   selector: borg/expose=vllm
      #   modelkey: borg/models
    k8s_service_discover:
      # Register an llm-d scheduler/router Service as one upstream endpoint.
      # - id: qwen-router
      #   namespace: llm-d
      #   service_name: qwen-inference-scheduler
      #   port_name: http
      #   models: ["Qwen/Qwen3-32B"]
      #   # Instead of explicit models, BORG can call the router's model API.
      #   automodel: true
      #   models_path: /v1/models
      #   apikeyEnv: LLMD_API_KEY

      # A label selector can discover multiple router Services. Each Service is
      # still treated as a front door, not expanded into its backing pods.
      # - id: llmd-routers
